{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FraudGuard AI | Secure Payments</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    color: white;
    overflow-x: hidden;
}

/* Background Image */
.hero-bg {
    position: fixed;
    inset: 0;
    background: 
        linear-gradient(rgba(5,11,30,0.85), rgba(5,11,30,0.85)),
        url("{% static 'images/cyber.jpeg' %}") center/cover no-repeat;
    z-index: -3;
}

/* 3D Canvas */
#bg {
    position: fixed;
    inset: 0;
    z-index: -2;
}

/* Navbar */
.navbar {
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
}

/* Section */
.section {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Glass Card */
.glass {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    border-radius: 20px;
    padding: 50px;
    max-width: 720px;
    text-align: center;
    box-shadow: 0 25px 60px rgba(0,0,0,0.7);
}

/* Buttons */
.btn-main {
    background: linear-gradient(135deg, #0d6efd, #20c997);
    border: none;
    border-radius: 30px;
    padding: 10px 28px;
    color: white;
}
</style>
</head>

<body>

<!-- BACKGROUND IMAGE -->
<div class="hero-bg"></div>

<!-- 3D CANVAS -->
<canvas id="bg"></canvas>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top px-4">
    <a class="navbar-brand fw-semibold">FraudGuard AI</a>
    <ul class="navbar-nav ms-auto align-items-center">
        <li class="nav-item"><a class="nav-link" href="{% url 'index' %}">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'UserLogin' %}">Login</a></li>
        <li class="nav-item">
            <a class="btn btn-main ms-3" href="{% url 'Register' %}">Sign Up</a>
        </li>
    </ul>
</nav>

<!-- HERO -->
<section class="section">
    <div class="glass">
        <h1>UPI Fraud Transaction Detection using Machine Learning</h1>
        <p class="mt-3">
            Secure digital transactions using machine learning & real-time fraud analysis
        </p>
        <a href="{% url 'UserLogin' %}" class="btn btn-main mt-3">
            Start Secure Monitoring
        </a>
    </div>
</section>

<script>
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    75, window.innerWidth / window.innerHeight, 0.1, 1000
);
camera.position.z = 12;

const renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById("bg"),
    alpha: true
});
renderer.setSize(window.innerWidth, window.innerHeight);

/* Lights */
scene.add(new THREE.AmbientLight(0xffffff, 0.8));

/* POINTS (Transactions) */
const pointsCount = 250;
const positions = [];
const colors = [];

for (let i = 0; i < pointsCount; i++) {
    positions.push(
        (Math.random() - 0.5) * 20,
        (Math.random() - 0.5) * 20,
        (Math.random() - 0.5) * 20
    );

    // Fraud probability
    const isFraud = Math.random() < 0.1;
    const color = isFraud ? new THREE.Color(1, 0.2, 0.2) : new THREE.Color(0, 0.8, 1);

    colors.push(color.r, color.g, color.b);
}

const geometry = new THREE.BufferGeometry();
geometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(positions, 3)
);
geometry.setAttribute(
    'color',
    new THREE.Float32BufferAttribute(colors, 3)
);

const material = new THREE.PointsMaterial({
    size: 0.12,
    vertexColors: true
});

const points = new THREE.Points(geometry, material);
scene.add(points);

/* LINES (Connections) */
const lineMaterial = new THREE.LineBasicMaterial({
    color: 0x00e5ff,
    opacity: 0.15,
    transparent: true
});

const lineGeometry = new THREE.BufferGeometry();
lineGeometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(positions, 3)
);

const lines = new THREE.LineSegments(lineGeometry, lineMaterial);
scene.add(lines);

/* Animate */
function animate() {
    requestAnimationFrame(animate);

    points.rotation.y += 0.0008;
    lines.rotation.y += 0.0008;

    renderer.render(scene, camera);
}
animate();

/* Scroll-based animation */
document.body.onscroll = () => {
    const t = document.body.getBoundingClientRect().top;
    camera.position.z = 12 + t * -0.002;
    camera.rotation.x = t * 0.0002;
};

/* Resize */
window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>


</body>
</html>
