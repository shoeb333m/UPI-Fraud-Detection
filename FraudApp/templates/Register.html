{% load static %}
<!DOCTYPE html>
<html>
<head>
<title>New User Register | FraudGuard AI</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- THREE JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #000;
    color: #fff;
}

/* Background animation */
#bg-anim {
    position: fixed;
    inset: 0;
    z-index: -2;
}

/* Dark overlay */
.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: -1;
}

/* Header */
.header {
    padding: 20px;
    text-align: center;
}

.header h1 {
    color: #00e5ff;
}

/* Menu */
.menu_nav {
    text-align: center;
    margin-bottom: 40px;
}

.menu_nav a {
    color: #fff;
    margin: 0 15px;
    text-decoration: none;
    font-weight: bold;
}

.menu_nav a:hover {
    color: #00e5ff;
}

/* Center wrapper */
.wrapper {
    min-height: 70vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Glass card */
.card {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    padding: 35px;
    width: 420px;
    border-radius: 15px;
    box-shadow: 0 0 30px rgba(0,229,255,0.35);
}

.card h2 {
    text-align: center;
    color: #00e5ff;
    margin-bottom: 20px;
}

/* Inputs */
input[type="text"],
input[type="password"] {
    width: 100%;
    padding: 8px;
    margin-bottom: 12px;
    border-radius: 6px;
    border: none;
    outline: none;
}

/* Button */
input[type="submit"] {
    width: 100%;
    padding: 10px;
    background: linear-gradient(135deg,#00e5ff,#20c997);
    border: none;
    border-radius: 25px;
    font-weight: bold;
    cursor: pointer;
}

input[type="submit"]:hover {
    opacity: 0.9;
}

.success {
    text-align: center;
    color: lightgreen;
}
</style>

<script>
function validate(formObj) {
    if(formObj.t1.value.length==0){ alert("Enter Username"); return false; }
    if(formObj.t2.value.length==0){ alert("Enter Password"); return false; }
    if(formObj.t3.value.length==0 || isNaN(formObj.t3.value)){
        alert("Enter valid Contact Number"); return false;
    }
    if(formObj.t4.value.length==0){
        alert("Enter Email"); return false;
    }
    if(formObj.t5.value.length==0){
        alert("Enter Address"); return false;
    }
    return true;
}
</script>
</head>

<body>

<canvas id="bg-anim"></canvas>
<div class="overlay"></div>

<div class="header">
    <h1>UPI Fraud Transaction Detection using Machine Learning</h1>
</div>

<div class="menu_nav">
    <a href="{% url 'index' %}">Home</a>
    <a href="{% url 'UserLogin' %}">User Login</a>
    <a href="{% url 'Register' %}">Sign Up</a>
</div>

<div class="wrapper">
<div class="card">

<h2>New User Signup</h2>
<div class="success">{{ data }}</div>

<form name="f1" method="post"
      action="{% url 'RegisterAction' %}"
      onsubmit="return validate(this);">
{% csrf_token %}

<input type="text" name="t1" placeholder="Username">
<input type="password" name="t2" placeholder="Password">
<input type="text" name="t3" placeholder="Contact Number">
<input type="text" name="t4" placeholder="Email ID">
<input type="text" name="t5" placeholder="Address">

<input type="submit" value="Register">
</form>

</div>
</div>

<!-- BACKGROUND ANIMATION -->
<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.z = 8;

const renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById("bg-anim"),
    alpha: true
});
renderer.setSize(window.innerWidth, window.innerHeight);

scene.add(new THREE.AmbientLight(0xffffff, 0.8));

const geometry = new THREE.BufferGeometry();
const positions = [];

for(let i=0;i<200;i++){
    positions.push(
        (Math.random()-0.5)*20,
        (Math.random()-0.5)*20,
        (Math.random()-0.5)*20
    );
}

geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));

const material = new THREE.PointsMaterial({
    color: 0x00e5ff,
    size: 0.07,
    transparent: true,
    opacity: 0.6
});

const points = new THREE.Points(geometry, material);
scene.add(points);

function animate(){
    requestAnimationFrame(animate);
    points.rotation.y += 0.0006;
    points.rotation.x += 0.0003;
    renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
