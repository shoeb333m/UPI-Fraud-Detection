{% load static %}
<!DOCTYPE html>
<html>
<head>
<title>FraudGuard AI | Dashboard</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- THREE JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #000;
    color: #fff;
}

/* Background animation */
#bg-anim {
    position: fixed;
    inset: 0;
    z-index: -2;
}

/* Overlay */
.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: -1;
}

/* Header */
.header {
    padding: 20px;
    text-align: center;
}

.header h1 {
    color: #00e5ff;
}

/* Menu */
.menu {
    text-align: center;
    margin-bottom: 30px;
}

.menu a {
    display: inline-block;
    margin: 8px;
    padding: 10px 18px;
    background: rgba(255,255,255,0.08);
    color: #fff;
    text-decoration: none;
    border-radius: 20px;
    font-weight: bold;
    transition: 0.3s;
}

.menu a:hover {
    background: #00e5ff;
    color: #000;
}

/* Main card */
.card {
    width: 90%;
    max-width: 1100px;
    margin: auto;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    border-radius: 15px;
    padding: 30px;
    box-shadow: 0 0 30px rgba(0,229,255,0.35);
}

/* Result text */
.result {
    color: #fff;
    margin-bottom: 20px;
}

/* Image */
.result img {
    max-width: 100%;
    border-radius: 12px;
    box-shadow: 0 0 25px rgba(0,0,0,0.6);
}

/* Logout */
.logout {
    text-align: center;
    margin-top: 30px;
}

.logout a {
    color: #ff5252;
    font-weight: bold;
    text-decoration: none;
}
</style>
</head>

<body>

<canvas id="bg-anim"></canvas>
<div class="overlay"></div>

<!-- HEADER -->
<div class="header">
    <h1>UPI Fraud Transaction Detection using Machine Learning</h1>
</div>

<!-- MENU -->
<div class="menu">
    <a href="{% url 'LoadDataset' %}">Load Dataset</a>
    <a href="{% url 'BalancedData' %}">Balanced Data</a>
    <a href="{% url 'TrainML' %}">Train ML Models</a>
    <a href="{% url 'Predict' %}">Detect Fraud</a>
    <a href="{% url 'manual_predict' %}">Manual</a>
    <a href="{% url 'prediction_history' %}">History</a>
</div>

<!-- CONTENT -->
<div class="card">

<div class="result">
    {{ data|safe }}
</div>

{% if img %}
<div class="result">
    <img src="data:image/png;base64, {{ img }}" alt="Result Graph">
</div>
{% endif %}

</div>

<!-- LOGOUT -->
<div class="logout">
    <a href="{% url 'index' %}">Logout</a>
</div>

<!-- BACKGROUND ANIMATION -->
<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.z = 8;

const renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById("bg-anim"),
    alpha: true
});
renderer.setSize(window.innerWidth, window.innerHeight);

scene.add(new THREE.AmbientLight(0xffffff, 0.8));

const geometry = new THREE.BufferGeometry();
const positions = [];

for(let i=0;i<220;i++){
    positions.push(
        (Math.random()-0.5)*20,
        (Math.random()-0.5)*20,
        (Math.random()-0.5)*20
    );
}

geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));

const material = new THREE.PointsMaterial({
    color: 0x00e5ff,
    size: 0.07,
    transparent: true,
    opacity: 0.6
});

const points = new THREE.Points(geometry, material);
scene.add(points);

function animate(){
    requestAnimationFrame(animate);
    points.rotation.y += 0.0006;
    points.rotation.x += 0.0003;
    renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
