{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Login | FraudGuard AI</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

<script>
function validate(formObj) {
    if (formObj.t1.value.length === 0) {
        alert("Please Enter Username");
        formObj.t1.focus();
        return false;
    }
    if (formObj.t2.value.length === 0) {
        alert("Please Enter Password");
        formObj.t2.focus();
        return false;
    }
    return true;
}
</script>

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    color: white;
    background: #000;
}

/* Animated canvas */
#bg-anim {
    position: fixed;
    inset: 0;
    z-index: -2;
}

/* Dark overlay */
.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: -1;
}

/* Navbar */
.navbar {
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(10px);
}

/* Center layout */
.login-wrapper {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Glass card */
.login-card {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(18px);
    border-radius: 20px;
    padding: 40px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 0 30px rgba(0,229,255,0.35);
}

/* Inputs */
.form-control {
    background: rgba(255,255,255,0.15);
    border: none;
    color: white;
}
.form-control::placeholder {
    color: #d0d0d0;
}
.form-control:focus {
    background: rgba(255,255,255,0.25);
    color: white;
    box-shadow: none;
}

/* Button */
.btn-login {
    background: linear-gradient(135deg, #00e5ff, #20c997);
    border: none;
    border-radius: 30px;
    padding: 10px;
    color: #000;
    font-weight: 600;
}
.btn-login:hover {
    opacity: 0.9;
}
</style>
</head>

<body>

<!-- BACKGROUND -->
<canvas id="bg-anim"></canvas>
<div class="overlay"></div>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark px-4 fixed-top">
    <a class="navbar-brand fw-semibold">FraudGuard AI</a>
    <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="{% url 'index' %}">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'Register' %}">Sign Up</a></li>
    </ul>
</nav>

<!-- LOGIN -->
<div class="login-wrapper">
    <div class="login-card">

        <h3 class="text-center mb-3">User Login</h3>
        <p class="text-center text-light mb-4">
            Secure access to Fraud Detection System
        </p>

        {% if data %}
        <div class="alert alert-danger text-center py-2">
            {{ data }}
        </div>
        {% endif %}

        <form name="f1" method="post"
              action="{% url 'UserLoginAction' %}"
              onsubmit="return validate(this);">
            {% csrf_token %}

            <div class="mb-3">
                <input type="text" name="t1" class="form-control"
                       placeholder="Username">
            </div>

            <div class="mb-3">
                <input type="password" name="t2" class="form-control"
                       placeholder="Password">
            </div>

            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-login">
                    Login
                </button>
            </div>
        </form>

        <p class="text-center mt-4 text-light">
            New user?
            <a href="{% url 'Register' %}" class="text-info text-decoration-none">
                Create an account
            </a>
        </p>

    </div>
</div>

<!-- THREE JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);
camera.position.z = 8;

const renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById("bg-anim"),
    alpha: true
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);

/* Light */
scene.add(new THREE.AmbientLight(0xffffff, 0.8));

/* Network points */
const geometry = new THREE.BufferGeometry();
const positions = [];

for (let i = 0; i < 200; i++) {
    positions.push(
        (Math.random() - 0.5) * 20,
        (Math.random() - 0.5) * 20,
        (Math.random() - 0.5) * 20
    );
}

geometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(positions, 3)
);

const material = new THREE.PointsMaterial({
    color: 0x00e5ff,
    size: 0.08,
    opacity: 0.6,
    transparent: true
});

const points = new THREE.Points(geometry, material);
scene.add(points);

/* Animation */
function animate() {
    requestAnimationFrame(animate);
    points.rotation.y += 0.0006;
    points.rotation.x += 0.0003;
    renderer.render(scene, camera);
}
animate();

/* Resize */
window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
