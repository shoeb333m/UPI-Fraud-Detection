{% load static %}
<!DOCTYPE html>
<html>
<head>
<title>Fraud Detection | FraudGuard AI</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- THREE JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #000;
    color: #fff;
}

/* Background animation */
#bg-anim {
    position: fixed;
    inset: 0;
    z-index: -2;
}

/* Overlay */
.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    z-index: -1;
}

/* Header */
.header {
    padding: 20px;
    text-align: center;
}

.header h1 {
    color: #00e5ff;
}

/* Menu */
.menu {
    text-align: center;
    margin-bottom: 30px;
}

.menu a {
    display: inline-block;
    margin: 8px;
    padding: 10px 18px;
    background: rgba(255,255,255,0.08);
    color: #fff;
    text-decoration: none;
    border-radius: 20px;
    font-weight: bold;
    transition: 0.3s;
}

.menu a:hover {
    background: #00e5ff;
    color: #000;
}

/* Center wrapper */
.wrapper {
    min-height: 60vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Glass card */
.card {
    width: 420px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    border-radius: 15px;
    padding: 35px;
    box-shadow: 0 0 30px rgba(0,229,255,0.35);
    text-align: center;
}

.card h2 {
    color: #00e5ff;
    margin-bottom: 20px;
}

/* Inputs */
input[type="file"] {
    width: 100%;
    padding: 6px;
    margin: 15px 0;
    background: #fff;
    border-radius: 6px;
}

/* Button */
input[type="submit"] {
    width: 100%;
    padding: 10px;
    background: linear-gradient(135deg,#00e5ff,#20c997);
    border: none;
    border-radius: 25px;
    font-weight: bold;
    cursor: pointer;
}

input[type="submit"]:hover {
    opacity: 0.9;
}

/* Message */
.msg {
    color: #ff5252;
    margin-bottom: 15px;
}
</style>

<script>
function validate(formObj) {
    if(formObj.t1.value.length == 0) {
        alert("Please upload test dataset");
        return false;
    }
    return true;
}
</script>
</head>

<body>

<canvas id="bg-anim"></canvas>
<div class="overlay"></div>

<!-- HEADER -->
<div class="header">
    <h1>UPI Fraud Transaction Detection using Machine Learning</h1>
</div>

<!-- MENU -->
<div class="menu">
    <a href="{% url 'LoadDataset' %}">Load Dataset</a>
    <a href="{% url 'BalancedData' %}">Balanced Data</a>
    <a href="{% url 'TrainML' %}">Train ML Models</a>
    <a href="{% url 'Predict' %}">Detect Fraud</a>
    <a href="{% url 'manual_predict' %}">Manual Detect</a>
    <a href="{% url 'index' %}">Logout</a>
</div>

<!-- CONTENT -->
<div class="wrapper">
<div class="card">

<h2>Fraud Detection from Test Data</h2>

<div class="msg">{{ data }}</div>

<form name="f1"
      method="post"
      action="{% url 'PredictAction' %}"
      enctype="multipart/form-data"
      onsubmit="return validate(this);">
{% csrf_token %}

<input type="file" name="t1">

<input type="submit" value="Detect Fraud">

</form>

</div>
</div>

<!-- BACKGROUND ANIMATION -->
<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.z = 8;

const renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById("bg-anim"),
    alpha: true
});
renderer.setSize(window.innerWidth, window.innerHeight);

scene.add(new THREE.AmbientLight(0xffffff, 0.8));

const geometry = new THREE.BufferGeometry();
const positions = [];

for(let i=0;i<220;i++){
    positions.push(
        (Math.random()-0.5)*20,
        (Math.random()-0.5)*20,
        (Math.random()-0.5)*20
    );
}

geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));

const material = new THREE.PointsMaterial({
    color: 0x00e5ff,
    size: 0.07,
    transparent: true,
    opacity: 0.6
});

const points = new THREE.Points(geometry, material);
scene.add(points);

function animate(){
    requestAnimationFrame(animate);
    points.rotation.y += 0.0006;
    points.rotation.x += 0.0003;
    renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
